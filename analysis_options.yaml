# Static analysis. Run with `flutter analyze`.
# The Flutter recommended lints are the base; the stricter settings below are
# deliberate (see docs/decisions.md).
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - web/**
  language:
    # Catch implicit dynamic and unchecked casts, which is where untyped JSON
    # parsing tends to go wrong.
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Treat these as errors so they cannot be left in by accident.
    unawaited_futures: error
    avoid_print: error
    always_use_package_imports: error

linter:
  rules:
    - always_declare_return_types
    - always_use_package_imports
    - avoid_dynamic_calls
    - avoid_print
    - avoid_void_async
    - cancel_subscriptions
    - close_sinks
    - directives_ordering
    - prefer_const_declarations
    - prefer_final_in_for_each
    - prefer_final_locals
    - prefer_single_quotes
    - sort_pub_dependencies
    - unawaited_futures
    - unnecessary_lambdas
    - use_super_parameters
